version: 1

system:
    name: null
    root_path: null

gdrive:
    # mirror the folder tree (folders only - no documents) into one folder
    # at the Google Drive root, named after this system. 00_INDEX is never
    # mirrored (it holds aardvark.db), and of each system folder's ten
    # reserved 00-09 subfolders only 01_inbox, 04_templates and 09_archive
    # are created. set up with
    # `aardvark connect_gdrive <clientId> <clientSecret>`, using an OAuth
    # client of type "Desktop app" from a Google Cloud project.
    enabled: false
    client_id: null
    client_secret: null
    refresh_token: null
    # full `drive` scope is the default because a narrower `drive.file`
    # only ever shows an app the files it created itself - which would make
    # it impossible to adopt a folder you made by hand, rather than
    # duplicating it. narrow it here if you would rather accept that.
    scope: https://www.googleapis.com/auth/drive
    root_folder_id: null

logging settings:
    formatters:
        file_style:
            format: '* %(asctime)s - %(name)s - %(levelname)s (%(pathname)s > %(funcName)s > %(lineno)d) - %(message)s  '
            datefmt: '%Y/%m/%d %H:%M:%S'
        console_style:
            format: '* %(asctime)s - %(levelname)s: %(pathname)s:%(funcName)s:%(lineno)d > %(message)s'
            datefmt: '%H:%M:%S'
        html_style:
            format: '<div id="row" class="%(levelname)s"><span class="date">%(asctime)s</span>   <span class="label">file:</span><span class="filename">%(filename)s</span>   <span class="label">method:</span><span class="funcName">%(funcName)s</span>   <span class="label">line#:</span><span class="lineno">%(lineno)d</span> <span class="pathname">%(pathname)s</span>  <div class="right"><span class="message">%(message)s</span><span class="levelname">%(levelname)s</span></div></div>'
            datefmt: '%Y-%m-%d <span class= "time">%H:%M <span class= "seconds">%Ss</span></span>'
    handlers:
        console:
            class: logging.StreamHandler
            level: DEBUG
            formatter: console_style
            stream: ext://sys.stdout
        file:
            class: logging.handlers.GroupWriteRotatingFileHandler
            level: WARNING
            formatter: file_style
            filename: ~/.config/aardvark/aardvark.log
            mode: w+
            maxBytes: 102400
            backupCount: 1
    root:
        level: WARNING
        handlers: [file,console]
