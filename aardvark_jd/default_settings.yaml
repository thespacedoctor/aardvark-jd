version: 1

system:
    name: null
    root_path: null

emoji:
    # ask Claude to suggest folder emoji, falling back to an offline keyword
    # search whenever the API is unreachable. set to false to stay offline.
    use_llm: true

spell_check:
    # offer to correct a suspected typo in a new folder's title, before
    # anything is created. only tokens of six characters or more are
    # checked, and only when a dictionary word one edit away exists.
    # declining a suggestion records that word in
    # `<root>/.aardvark-vocabulary` and it is never offered again, so the
    # check goes quiet on your own jargon as you use it. set to false to
    # switch it off entirely.
    enabled: true

craft:
    # mirror the aardvark folder tree into a craft.do space. set up with
    # `aardvark connect_craft <apiUrl> <apiToken>`, both copied from the
    # Connections tab of the Craft space you want to mirror into - the API
    # url is unique per connection, not a fixed global endpoint.
    enabled: false
    api_url: null
    api_token: null

dropbox:
    # add a Dropbox share link alongside the Finder link on every synced
    # Craft document, when the aardvark system root sits inside a
    # Dropbox-synced folder. set up with `aardvark connect_dropbox <appKey>
    # <appSecret>`, both copied from a Dropbox app in the App Console - the
    # one-time browser flow stores a long-lived refresh token here.
    enabled: false
    app_key: null
    app_secret: null
    refresh_token: null

todoist:
    # mirror areas/categories (under 03 AREAS) and project ids (flat,
    # under 02 PROJECTS) into Todoist as nested projects, each carrying a
    # Finder/Dropbox/Craft link back to its sibling objects. set up with
    # `aardvark connect_todoist <apiToken>`, a personal API token from
    # Todoist's Settings -> Integrations -> Developer tab.
    enabled: false
    api_token: null

gdrive:
    # mirror the folder tree (folders only - no documents) into one folder
    # at the Google Drive root, named after this system. 00_INDEX is never
    # mirrored (it holds aardvark.db), and of each system folder's ten
    # reserved 00-09 subfolders only 01_inbox, 04_templates and 09_archive
    # are created. set up with
    # `aardvark connect_gdrive <clientId> <clientSecret>`, using an OAuth
    # client of type "Desktop app" from a Google Cloud project.
    enabled: false
    client_id: null
    client_secret: null
    refresh_token: null
    # full `drive` scope is the default because a narrower `drive.file`
    # only ever shows an app the files it created itself - which would make
    # it impossible to adopt a folder you made by hand, rather than
    # duplicating it. narrow it here if you would rather accept that.
    scope: https://www.googleapis.com/auth/drive
    root_folder_id: null

logging settings:
    formatters:
        file_style:
            format: '* %(asctime)s - %(name)s - %(levelname)s (%(pathname)s > %(funcName)s > %(lineno)d) - %(message)s  '
            datefmt: '%Y/%m/%d %H:%M:%S'
        console_style:
            format: '* %(asctime)s - %(levelname)s: %(pathname)s:%(funcName)s:%(lineno)d > %(message)s'
            datefmt: '%H:%M:%S'
        html_style:
            format: '<div id="row" class="%(levelname)s"><span class="date">%(asctime)s</span>   <span class="label">file:</span><span class="filename">%(filename)s</span>   <span class="label">method:</span><span class="funcName">%(funcName)s</span>   <span class="label">line#:</span><span class="lineno">%(lineno)d</span> <span class="pathname">%(pathname)s</span>  <div class="right"><span class="message">%(message)s</span><span class="levelname">%(levelname)s</span></div></div>'
            datefmt: '%Y-%m-%d <span class= "time">%H:%M <span class= "seconds">%Ss</span></span>'
    handlers:
        console:
            class: logging.StreamHandler
            level: DEBUG
            formatter: console_style
            stream: ext://sys.stdout
        file:
            class: logging.handlers.GroupWriteRotatingFileHandler
            level: WARNING
            formatter: file_style
            filename: ~/.config/aardvark/aardvark.log
            mode: w+
            maxBytes: 102400
            backupCount: 1
    root:
        level: WARNING
        handlers: [file,console]
