[build-system]
requires = ["setuptools>=70", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aardvark"
dynamic = ["version"]
description = "A PARA + Johnny Decimal filing and indexing system, backed by SQLite"
authors = [
    {name = "David Young", email= "david.young.rse@gmail.com"},
]
keywords = ['para', 'johnny-decimal', 'filing', 'knowledge-management', 'cli']
requires-python = ">=3.14"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities"
]
dependencies = [
    'pyyaml',
    'fundamentals',
    'docopt',
    'emoji'
]

[project.urls]
"Homepage" = "https://github.com/thespacedoctor/aardvark"

[project.optional-dependencies]
docs = [
    "build",
    "sphinx",
    "sphinx-autodoc2",
    "myst-parser",
    "furo",
    "sphinx-inline-tabs",
    "sphinxext-opengraph",
    "sphinx-autobuild",
    "linkify-it-py",
    "sphinxcontrib-mermaid",
    "sphinx-togglebutton",
    "sphinx_copybutton",
    "sphinx_tippy",
    "sphinx_design",
    "pygments-csv-lexer",
    "sphinxcontrib-svg2pdfconverter",
    "sphinx-remove-toctrees",
    "sphinxcontrib.bibtex",
]
tests = [
    "pytest",
    "pytest-cov",
    "nose2"
]
dev = [
    "aardvark[tests, docs]",
    "build",
    "twine"
]

# THESE ARE ENTRY POINTS USED FOR THE CL-INTERFACE
[project.scripts]
aardvark = 'aardvark.cl_utils:main'


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
aardvark = ["resources/**/*"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "aardvark/__version__.py"
write_to_template = "__version__ = '{version}'\n"


