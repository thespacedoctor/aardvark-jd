name: Tests

# RUNS THE TEST SUITE ON EVERY PULL REQUEST INTO main OR develop AND ON EVERY PUSH TO develop.
# A CHANGE THAT TOUCHES ONLY CHANGES.md SKIPS THIS WORKFLOW
on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "CHANGES.md"
  push:
    branches:
      - develop
    paths-ignore:
      - "CHANGES.md"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[tests]"

      - name: Run tests
        run: python -m pytest -m "not slow and not full"
